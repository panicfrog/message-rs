[workspace]
resolver = "2"
members = [
    "protocol/message-core",
    "protocol/message-derive",
    "protocol/message-gen",
    "protocol/message-fixtures",
    "protocol/playground",
    "hub",
    "hub/ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
inventory = "0.3"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
message-core = { path = "protocol/message-core" }
message-gen = { path = "protocol/message-gen" }
