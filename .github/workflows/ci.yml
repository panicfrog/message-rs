name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Evolution gate against the committed snapshot
        run: cargo run -p message-fixtures --bin export-schema -- check vectors/message-snapshot.json
      - name: Generated artifacts are up to date
        run: |
          cargo run -p message-fixtures --bin export-schema -- export vectors/message-snapshot.json
          cargo run -p message-fixtures --bin export-schema -- vectors vectors/user.json
          cargo run -p message-fixtures --bin export-schema -- ts runtime/ts/src/schema.ts
          cargo run -p message-fixtures --bin export-schema -- swift runtime/swift/Sources/MessageFixtures/Schema.swift
          cargo run -p message-fixtures --bin export-schema -- kotlin runtime/kotlin/message-fixtures/src/main/kotlin/message/rs/Schema.kt
          cargo run -p message-fixtures --bin export-schema -- kotlin runtime/kotlin/message-fixtures/src/test/kotlin/message/rs/moved/Schema.kt --package message.rs.moved
          git diff --exit-code --stat

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: runtime/swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  hub-swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: hub/swift
    steps:
      - uses: actions/checkout@v4
      # the package's binaryTarget: build the Rust slices into an xcframework first
      - run: ./scripts/build-xcframework.sh
      - run: swift test

  hub-kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # the tests load the host dylib by absolute path (-PhubLibDir); cargo runs from the root
      - run: cargo build -p hub-jni
        working-directory: .
      - run: ./gradlew test -PhubLibDir="$GITHUB_WORKSPACE/target/debug"

  hub-turbo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/turbo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/turbo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
